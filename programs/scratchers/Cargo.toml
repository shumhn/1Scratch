[package]
name = "scratchers"
version = "0.1.0"
description = "Stock Scratchers — VRF scratch cards that pay prizes in tokenized stocks & Solana assets"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "scratchers"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# Exact pins. 1.0.2 lacks system_program::create_account_allow_prefund, which the
# SDK 0.18 vrf/commit macros generate; 1.2.2 changes the CpiContext API.
# 1.1.2 has the prefund helper AND the classic CpiContext(AccountInfo) API,
# and matches the local anchor-cli 1.1.2 (same combo as unwindfi).
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = "=1.1.2"
# MagicBlock ER SDK — pinned to the 1.x+2.0 validator line.
# Do NOT bump to 0.20: its #[vrf] macro fails to compile (E0433 slot_hashes).
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "vrf"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
